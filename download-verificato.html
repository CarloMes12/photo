<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scarica la foto — Carlo.Mes</title><style>body{font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#e4f2e8,#fff6e7);color:#24523c;margin:0;padding:20px}main{background:#fffdf9;border-radius:24px;max-width:460px;padding:35px;text-align:center;box-shadow:0 15px 55px #285b3a20}h1{font-family:Georgia,serif}button{background:#277354;color:white;border:0;padding:16px 25px;border-radius:14px;font-size:17px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}a{color:#277354}</style></head><body><main><div style="font-size:45px">🎄📸</div><h1>La tua foto di Natale</h1><p id="status" role="status">Verifico il pagamento direttamente con Stripe…</p><button id="download" disabled>Scarica la fotografia</button><p><a href="index.html">Torna alla pagina iniziale</a></p></main><script>const API='https://jpctjrzvjljhouvpmptb.supabase.co/functions/v1/verifica-pagamento';const statusEl=document.getElementById('status'),button=document.getElementById('download');let photo=null;async function verify(){button.disabled=true;const session_id=new URLSearchParams(location.search).get('session_id');if(!session_id){statusEl.textContent='Nessuna sessione di pagamento presente.';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Pagamento non confermato');photo=d;statusEl.textContent='Pagamento verificato! Puoi scaricare la tua fotografia.';button.disabled=false}catch(e){statusEl.textContent=e.message+' — Se hai appena pagato, attendi qualche secondo e ricarica la pagina.'}}button.addEventListener('click',async()=>{if(!photo)return;button.disabled=true;try{const r=await fetch(photo.download_url);if(!r.ok)throw Error('Link scaduto');const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=photo.photo_id;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){statusEl.textContent='Il link è scaduto. Ricarica la pagina per verificarlo di nuovo.'}finally{button.disabled=false}});verify();</script></body></html>
