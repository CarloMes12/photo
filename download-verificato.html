<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La tua foto di Natale — Carlo.Mes</title>
<style>
body{font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#e4f2e8,#fff6e7);color:#24523c;margin:0;padding:20px;box-sizing:border-box}
main{background:#fffdf9;border-radius:24px;width:min(100%,460px);box-sizing:border-box;padding:35px;text-align:center;box-shadow:0 15px 55px #285b3a20}
h1{font-family:Georgia,serif;font-size:clamp(27px,6vw,38px)}button{background:#277354;color:white;border:0;padding:16px 25px;border-radius:14px;font-size:17px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}p{line-height:1.6}a{color:#277354}#retry{background:transparent;border:1px solid #94b7a3;color:#24523c;margin-top:10px;font-size:14px;padding:9px 15px}#retry[hidden]{display:none}
</style>
</head>
<body><main>
<div style="font-size:45px">🎄📸</div><h1>La tua foto di Natale</h1>
<p id="status" role="status" aria-live="polite">Verifico il pagamento…</p>
<button id="download" disabled>Scarica la fotografia</button>
<div><button id="retry" type="button" hidden>Riprova la verifica</button></div>
<p><a href="index.html">Torna alla pagina iniziale</a></p>
</main>
<script>
'use strict';
const API='https://jpctjrzvjljhouvpmptb.supabase.co/functions/v1/verifica-pagamento';
const statusEl=document.getElementById('status');
const button=document.getElementById('download');
const retry=document.getElementById('retry');
const sessionId=new URLSearchParams(location.search).get('session_id');
let photo=null,attempt=0,checking=false;
const MAX_ATTEMPTS=4;
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function verify(){
 if(checking)return;
 if(!sessionId){statusEl.textContent='Nessuna sessione di pagamento presente.';return;}
 checking=true;button.disabled=true;retry.hidden=true;
 try{
  for(attempt=0;attempt<MAX_ATTEMPTS;attempt++){
   statusEl.textContent=attempt===0?'Verifico il pagamento…':'Attendo la conferma di Stripe…';
   let response,data;
   try{
    response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId}),cache:'no-store'});
    data=await response.json();
   }catch(e){throw new Error('Connessione non disponibile. Riprova.');}
   if(response.ok&&data.success&&data.download_url){
    photo=data;button.disabled=false;
    statusEl.textContent='Ordine confermato! Puoi scaricare la tua fotografia.';
    return;
   }
   if(response.status===403 && data.error==='Pagamento non ancora confermato' && attempt<MAX_ATTEMPTS-1){await wait(1200);continue;}
   throw new Error(data.error||'Impossibile verificare il pagamento');
  }
 }catch(e){statusEl.textContent=e.message;retry.hidden=false;}
 finally{checking=false;}
}
button.addEventListener('click',async()=>{
 if(!photo)return;
 button.disabled=true;
 try{
  // Link temporaneo creato soltanto dopo la verifica lato server.
  const response=await fetch(photo.download_url,{cache:'no-store'});
  if(!response.ok)throw new Error('Il link è scaduto');
  const blob=await response.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=photo.photo_id||'Foto_Magica.jpg';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  statusEl.textContent='Download avviato!';
 }catch(e){statusEl.textContent='Non riesco a scaricare il file. Premi Riprova la verifica.';photo=null;retry.hidden=false;}
 finally{button.disabled=photo===null;}
});
retry.addEventListener('click',verify);
verify();
</script></body></html>
