<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reindirizzamento al pagamento</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f4fbf4,#e1f2e4);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#234735;padding:24px}.panel{text-align:center;width:min(100%,440px);padding:40px 24px;background:rgba(255,255,255,.72);border:1px solid #d3e7d6;border-radius:22px;box-shadow:0 14px 45px #315b3810}h1{font-size:clamp(20px,5vw,25px);line-height:1.4;margin:0 0 24px;font-weight:650}.count{font-size:70px;line-height:1;font-weight:750;color:#31734b;font-variant-numeric:tabular-nums}.small{margin:18px 0 0;color:#5b7665;font-size:13px}a{color:#236a42}
</style>
</head>
<body>
<main class="panel">
<h1>Ti stiamo per reindirizzare a Stripe per eseguire il pagamento.</h1>
<div class="count" id="countdown" aria-live="polite">2</div>
<p class="small">Se il reindirizzamento non avviene, <a id="paymentLink" href="https://buy.stripe.com/fZu9AVfzvd3O9ue6Ndawo01">clicca qui</a>.</p>
</main>
<script>
// Link di pagamento
const LINK_DESTINAZIONE = "https://buy.stripe.com/fZu9AVfzvd3O9ue6Ndawo01";
document.getElementById('paymentLink').href = LINK_DESTINAZIONE;
let secondi = 2;
const timer = setInterval(() => {
  secondi--;
  document.getElementById('countdown').textContent = secondi;
  if (secondi === 0) {
    clearInterval(timer);
    window.location.replace(LINK_DESTINAZIONE);
  }
}, 1000);
</script>
</body>
</html>
