<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reindirizzamento al pagamento Stripe</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f4fbf4,#e1f2e4);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#234735;padding:22px}
.panel{text-align:center;width:min(100%,440px);min-height:390px;padding:49px 28px 45px;background:rgba(255,255,255,.82);border:1px solid #d3e7d6;border-radius:25px;box-shadow:0 18px 50px #315b3815;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:clamp(20px,5vw,24px);line-height:1.45;margin:0 0 15px;font-weight:700;max-width:350px}
.description{font-size:14px;line-height:1.6;color:#587262;margin:0 0 27px;max-width:345px}
.timer{position:relative;width:130px;height:130px;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.track{stroke:#f9e7e7}.progress{stroke:#e6a0a5;stroke-linecap:round;stroke-dasharray:339.292;stroke-dashoffset:0}
.count{font-size:60px;line-height:1;font-weight:750;color:#cb858c;font-variant-numeric:tabular-nums}
.small{margin:22px 0 0;color:#658070;font-size:13px}
@media(max-width:420px){.panel{padding:43px 22px;min-height:380px}}
</style>
</head>
<body>
<main class="panel">
<h1>Ti stiamo per reindirizzare a Stripe per eseguire il pagamento.</h1>
<p class="description">Tra pochi secondi verrai trasferito automaticamente alla pagina di pagamento sicuro di Stripe, dove potrai completare il pagamento.</p>
<div class="timer" role="timer" aria-label="Secondi rimanenti">
<svg viewBox="0 0 144 144" aria-hidden="true"><circle class="track" cx="72" cy="72" r="54"/><circle class="progress" id="progress" cx="72" cy="72" r="54"/></svg>
<div class="count" id="countdown">5</div>
</div>
<p class="small">Reindirizzamento automatico in corso...</p>
</main>
<script>
// LINK DI PAGAMENTO: modifica solo questa riga se necessario.
const LINK_DESTINAZIONE = "https://buy.stripe.com/fZu9AVfzvd3O9ue6Ndawo01";
const DURATA_SECONDI = 5;
const countdown = document.getElementById('countdown');
const progress = document.getElementById('progress');
const circonferenza = 2 * Math.PI * 54;
progress.style.strokeDasharray = circonferenza;
const inizio = performance.now();
function aggiorna(ora) {
  const trascorso = Math.min((ora - inizio) / 1000, DURATA_SECONDI);
  const rimanenti = Math.max(0, DURATA_SECONDI - trascorso);
  countdown.textContent = Math.ceil(rimanenti);
  progress.style.strokeDashoffset = circonferenza * (trascorso / DURATA_SECONDI);
  if (trascorso >= DURATA_SECONDI) {
    window.location.replace(LINK_DESTINAZIONE);
    return;
  }
  requestAnimationFrame(aggiorna);
}
requestAnimationFrame(aggiorna);
</script>
</body>
</html>
